<!DOCTYPE html>
<html lang="sd" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G ONE WEB - ايڊمن پينل</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --border-color: #334155;
      --primary: #2563eb;
      --accent: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); padding: 20px 10px; }
    .container { max-width: 750px; margin: 0 auto; }
    
    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    h2 { margin-bottom: 15px; color: #38bdf8; font-size: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }

    /* Admin Tab Navigation */
    .admin-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 8px;
    }
    .admin-tab-btn {
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: #94a3b8;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      transition: all 0.2s;
    }
    .admin-tab-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
    input[type="text"], input[type="password"], textarea, select {
      width: 100%;
      padding: 10px;
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: white;
      border-radius: 6px;
      font-size: 14px;
    }
    textarea { height: 110px; resize: vertical; }

    .checkbox-group { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      font-size: 15px;
    }
    .btn:hover { opacity: 0.9; }

    /* Scrollable Box for News & Videos */
    .admin-scroll-box {
      max-height: 400px;
      overflow-y: auto;
      padding-right: 5px;
      scrollbar-width: thin;
      scrollbar-color: var(--primary) transparent;
    }
    .admin-scroll-box::-webkit-scrollbar { width: 5px; }
    .admin-scroll-box::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }

    .news-item-admin {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid var(--border-color);
      background: #111827;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    .action-btns { display: flex; gap: 6px; }
    .btn-edit { background: var(--warning); padding: 6px 10px; border-radius: 4px; border: none; color: black; cursor: pointer; font-weight: bold; font-size: 12px; }
    .btn-delete { background: var(--accent); padding: 6px 10px; border-radius: 4px; border: none; color: white; cursor: pointer; font-weight: bold; font-size: 12px; }
    
    .badge {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #334155;
      color: #38bdf8;
    }

    #login-section { max-width: 400px; margin: 50px auto; }
  </style>
</head>
<body>

  <div class="container">

    <!-- Login Box -->
    <div id="login-section" class="card">
      <h2>🔑 ايڊمن لاگ ان</h2>
      <div class="form-group">
        <label>پاسورڊ درج ڪريو:</label>
        <input type="password" id="admin-password" placeholder="Passcode لکو...">
      </div>
      <button class="btn" onclick="checkAuth()">لاگ ان ٿيو</button>
    </div>

    <!-- Main Dashboard Section -->
    <div id="dashboard-section" style="display:none;">

      <!-- Admin Header Tabs -->
      <div class="admin-tabs">
        <button class="admin-tab-btn active" id="tab-news-btn" onclick="switchAdminTab('news')">📰 خبرن جا اوزار</button>
        <button class="admin-tab-btn" id="tab-video-btn" onclick="switchAdminTab('video')">🎥 وڊيو جا اوزار</button>
      </div>

      <input type="hidden" id="edit-news-id" value="">

      <!-- TAB 1: GENERAL NEWS SECTION -->
      <div id="section-news">
        <div class="card">
          <h2 id="news-form-title">📝 نئين خبر پبلش ڪريو</h2>

          <div class="form-group">
            <label>خبر جي سرخي (Title):</label>
            <input type="text" id="news-title" placeholder="هتي سرخي لکو...">
          </div>

          <div class="form-group">
            <label>خبر جو ڪيٽيگري:</label>
            <select id="news-category">
              <option value="local">📍 لوڪل خبرون</option>
              <option value="science">🧬 سائنس</option>
              <option value="international">🌍 انٽرنيشنل</option>
              <option value="technology">💻 ٽيڪنالوجي</option>
              <option value="sports">⚽ اسپورٽس</option>
            </select>
          </div>

          <div class="form-group">
            <label>خبر جو تفصيل (Content):</label>
            <textarea id="news-content" placeholder="پوري خبر تفصيل سان لکو..."></textarea>
          </div>

          <div class="form-group">
            <label>تصوير جو لنڪ (Image URL):</label>
            <input type="text" id="news-image" placeholder="https://example.com/image.jpg">
          </div>

          <div class="form-group checkbox-group">
            <input type="checkbox" id="news-trending">
            <label for="news-trending">🔥 خاص خبر (Top Slider Ticker ۾ شو ڪريو)</label>
          </div>

          <button class="btn" id="news-submit-btn" onclick="submitNews()">پبلش ڪريو</button>
          <button class="btn" id="cancel-edit-btn" onclick="resetForm()" style="display:none; background:#64748b; margin-top:8px;">منسوخ ڪريو</button>
        </div>

        <div class="card">
          <h2>📰 لڳايل خبرن جي لسٽ (اسڪرول واري)</h2>
          <div class="admin-scroll-box" id="admin-news-list">لوڊ ٿي رهيو آهي...</div>
        </div>
      </div>

      <!-- TAB 2: SEPARATE VIDEO SECTION -->
      <div id="section-video" style="display:none;">
        <div class="card">
          <h2>🎥 وڊيو / Reel پبلش ڪريو</h2>

          <div class="form-group">
            <label>وڊيو جي سرخي (Title):</label>
            <input type="text" id="vid-title" placeholder="وڊيو جي سرخي لکو...">
          </div>

          <div class="form-group">
            <label>فيس بڪ / يوٽيوب / Reel جو لنڪ:</label>
            <input type="text" id="vid-url" placeholder="مثال: https://www.facebook.com/reel/2154340318797676">
          </div>

          <div class="form-group">
            <label>وڊيو بابت ڪجھ تفصيل (اختياري):</label>
            <textarea id="vid-content" placeholder="وڊيو جي باري ۾ مختصر معلومات..." style="height:70px;"></textarea>
          </div>

          <button class="btn" id="vid-submit-btn" onclick="submitVideo()" style="background:#10b981;">🎥 وڊيو پبلش ڪريو</button>
        </div>

        <div class="card">
          <h2>🎥 لڳايل وڊيوز جي لسٽ (اسڪرول واري)</h2>
          <div class="admin-scroll-box" id="admin-video-list">لوڊ ٿي رهيو آهي...</div>
        </div>
      </div>

    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://hhywazbkgalioqqpuhyz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhoeXdhemJrZ2FsaW9xcXB1aHl6Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4ODE0OTI0MCwiZXhwIjoyMTAzNzI1MjQwfQ.yHHUaGrOn8gKy_1kgujNXupqziJZmQalVIS0F9AU0sY';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allFetchedNews = [];

    function checkAuth() {
      const pass = document.getElementById('admin-password').value;
      if (pass === 'admin123') {
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('dashboard-section').style.display = 'block';
        fetchAdminNews();
      } else {
        alert('غلط پاسورڊ!');
      }
    }

    function switchAdminTab(tab) {
      document.getElementById('tab-news-btn').classList.remove('active');
      document.getElementById('tab-video-btn').classList.remove('active');

      if (tab === 'news') {
        document.getElementById('tab-news-btn').classList.add('active');
        document.getElementById('section-news').style.display = 'block';
        document.getElementById('section-video').style.display = 'none';
      } else {
        document.getElementById('tab-video-btn').classList.add('active');
        document.getElementById('section-news').style.display = 'none';
        document.getElementById('section-video').style.display = 'block';
      }
    }

    // Refused to Connect Error Fixer Function
    function processVideoInput(input) {
      if(!input) return null;
      input = input.trim();
      if (input.includes('<iframe')) return input;

      // Facebook Reel or Video
      if (input.includes('facebook.com')) {
        const encUrl = encodeURIComponent(input);
        return `<iframe src="https://www.facebook.com/plugins/video.php?href=${encUrl}&show_text=false" width="100%" height="320" style="border:none;overflow:hidden" scrolling="no" frameborder="0" allowfullscreen="true" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"></iframe>`;
      }

      // YouTube Video
      if (input.includes('youtube.com') || input.includes('youtu.be')) {
        let ytId = '';
        if(input.includes('v=')) ytId = input.split('v=')[1].split('&')[0];
        else if(input.includes('youtu.be/')) ytId = input.split('youtu.be/')[1].split('?')[0];
        if(ytId) return `<iframe width="100%" height="220" src="https://www.youtube.com/embed/${ytId}" frameborder="0" allowfullscreen></iframe>`;
      }

      return input;
    }

    async function submitNews() {
      const editId = document.getElementById('edit-news-id').value;
      const title = document.getElementById('news-title').value.trim();
      const category = document.getElementById('news-category').value;
      const content = document.getElementById('news-content').value.trim();
      const imageUrl = document.getElementById('news-image').value.trim();
      const isTrending = document.getElementById('news-trending').checked;

      if (!title || !content) {
        alert('مهرباني ڪري خبر جي سرخي ۽ تفصيل لکو!');
        return;
      }

      const payload = {
        title: title,
        category: category,
        content: content,
        image_url: imageUrl || null,
        is_trending: isTrending
      };

      let res;
      if (editId) {
        res = await _supabase.from('news').update(payload).eq('id', editId);
      } else {
        res = await _supabase.from('news').insert([payload]);
      }

      if (res.error) {
        alert('خرابي: ' + res.error.message);
      } else {
        alert(editId ? 'خبر اپڊيٽ ٿي وئي!' : 'خبر پبلش ٿي وئي!');
        resetForm();
        fetchAdminNews();
      }
    }

    async function submitVideo() {
      const title = document.getElementById('vid-title').value.trim();
      const rawUrl = document.getElementById('vid-url').value.trim();
      const content = document.getElementById('vid-content').value.trim();

      if (!title || !rawUrl) {
        alert('سرخي ۽ وڊيو لنڪ لازمي آهن!');
        return;
      }

      const embedCode = processVideoInput(rawUrl);

      const { error } = await _supabase.from('news').insert([{
        title: title,
        category: 'video',
        content: content || 'G One Video',
        video_code: embedCode,
        is_trending: false
      }]);

      if(error) {
        alert('خرابي: ' + error.message);
      } else {
        alert('وڊيو کاميابي سان پوسٽ ٿي وئي!');
        document.getElementById('vid-title').value = '';
        document.getElementById('vid-url').value = '';
        document.getElementById('vid-content').value = '';
        fetchAdminNews();
      }
    }

    async function fetchAdminNews() {
      const { data: news, error } = await _supabase.from('news').select('*').order('created_at', { ascending: false });
      
      if(error || !news) return;
      allFetchedNews = news;

      const textNews = news.filter(n => n.category !== 'video');
      const videoNews = news.filter(n => n.category === 'video' || n.video_code);

      // Render News List
      const newsContainer = document.getElementById('admin-news-list');
      if(textNews.length === 0) {
        newsContainer.innerHTML = '<p style="color:#94a3b8;">ڪابه خبر ناهي ملي.</p>';
      } else {
        newsContainer.innerHTML = textNews.map(item => `
          <div class="news-item-admin">
            <div>
              <strong>${item.title}</strong>
              <div style="font-size:12px; color:#94a3b8; margin-top:4px;">
                <span class="badge">${item.category}</span>
                ${item.is_trending ? '🔥 خاص خبر' : ''}
              </div>
            </div>
            <div class="action-btns">
              <button class="btn-edit" onclick="editNews('${item.id}')">✏️ ايڊٽ</button>
              <button class="btn-delete" onclick="deleteNews('${item.id}')">🗑️ ڊليٽ</button>
            </div>
          </div>
        `).join('');
      }

      // Render Videos List
      const videoContainer = document.getElementById('admin-video-list');
      if(videoNews.length === 0) {
        videoContainer.innerHTML = '<p style="color:#94a3b8;">ڪابه وڊيو پوسٽ ناهي ٿيل.</p>';
      } else {
        videoContainer.innerHTML = videoNews.map(item => `
          <div class="news-item-admin">
            <div>
              <strong>🎥 ${item.title}</strong>
            </div>
            <div class="action-btns">
              <button class="btn-edit" onclick="editNews('${item.id}')">✏️ ايڊٽ</button>
              <button class="btn-delete" onclick="deleteNews('${item.id}')">🗑️ ڊليٽ</button>
            </div>
          </div>
        `).join('');
      }
    }

    function editNews(id) {
      const item = allFetchedNews.find(n => n.id == id);
      if(!item) return;

      switchAdminTab('news');

      document.getElementById('edit-news-id').value = item.id;
      document.getElementById('news-title').value = item.title;
      document.getElementById('news-category').value = item.category === 'video' ? 'local' : item.category;
      document.getElementById('news-content').value = item.content;
      document.getElementById('news-image').value = item.image_url || '';
      document.getElementById('news-trending').checked = item.is_trending || false;

      document.getElementById('news-form-title').innerText = "✏️ خبر ايڊٽ ڪريو";
      document.getElementById('news-submit-btn').innerText = "اپڊيٽ ڪريو";
      document.getElementById('cancel-edit-btn').style.display = 'block';

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
      document.getElementById('edit-news-id').value = '';
      document.getElementById('news-title').value = '';
      document.getElementById('news-content').value = '';
      document.getElementById('news-image').value = '';
      document.getElementById('news-trending').checked = false;

      document.getElementById('news-form-title').innerText = "📝 نئين خبر پبلش ڪريو";
      document.getElementById('news-submit-btn').innerText = "پبلش ڪريو";
      document.getElementById('cancel-edit-btn').style.display = 'none';
    }

    async function deleteNews(id) {
      if(confirm('ڇا توهان يقينن هي ڊليٽ ڪرڻ چاهيو ٿا؟')) {
        const { error } = await _supabase.from('news').delete().eq('id', id);
        if(!error) fetchAdminNews();
        else alert('خرابي: ' + error.message);
      }
    }
  </script>
</body>
</html>
