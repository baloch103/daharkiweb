<!DOCTYPE html>
<html lang="sd" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ایڊمن پينل - DaharkiWeb</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f1f5f9; color: #333; padding: 20px; }
    .admin-card { background: white; padding: 25px; border-radius: 10px; max-width: 900px; margin: 0 auto 30px auto; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    h2 { color: #0f172a; margin-bottom: 20px; border-bottom: 2px solid #38bdf8; padding-bottom: 8px; }
    
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #475569; }
    input, textarea, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; }
    textarea { height: 120px; resize: vertical; }
    
    .checkbox-group { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
    .checkbox-group input { width: auto; }

    button { background: #0284c7; color: white; border: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; transition: background 0.3s; }
    button:hover { background: #0369a1; }
    
    /* Edit/Delete Table Styling */
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: right; }
    th { background: #f8fafc; color: #334155; }
    tr:nth-child(even) { background: #f8fafc; }
    
    .btn-action { padding: 6px 12px; font-size: 13px; margin-left: 5px; border-radius: 4px; border: none; cursor: pointer; }
    .btn-edit { background: #f59e0b; color: white; }
    .btn-edit:hover { background: #d97706; }
    .btn-delete { background: #ef4444; color: white; }
    .btn-delete:hover { background: #dc2626; }
    .btn-cancel { background: #64748b; color: white; display: none; margin-top: 10px; }
  </style>
</head>
<body>

  <!-- News Form Card (Add/Edit) -->
  <div class="admin-card">
    <h2 id="form-heading">نئين خبر شامل ڪريو</h2>
    <form id="news-form">
      <!-- Hidden ID field for Edit Mode -->
      <input type="hidden" id="news-id">

      <div class="form-group">
        <label for="title">خبر جو عنوان (Title):</label>
        <input type="text" id="title" required placeholder="عنوان لکو...">
      </div>

      <div class="form-group">
        <label for="category">ڪيٽيگري (Category):</label>
        <select id="category" required>
          <option value="local">لوڪل خبرون (local)</option>
          <option value="science">سائنسي معلومات (science)</option>
          <option value="technology">ٽيڪنالوجي (technology)</option>
          <option value="international">انٽرنيشنل (international)</option>
          <option value="sports">اسپورٽس (sports)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="image_url">تصوير جو لنڪ (Image URL):</label>
        <input type="text" id="image_url" placeholder="https://example.com/image.jpg">
      </div>

      <div class="form-group">
        <label for="content">خبر جو تفصيل (Content):</label>
        <textarea id="content" required placeholder="پوري خبر تفصيل سان لکو..."></textarea>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="is_trending">
        <label for="is_trending" style="margin:0;">ڇا هي خبر مٿئين پٽي (Ticker/Trending) ۾ به هلائڻي آهي؟</label>
      </div>

      <button type="submit" id="btn-submit">خبر پبلش ڪريو</button>
      <button type="button" id="btn-cancel" class="btn-cancel" onclick="resetForm()">منسوخ (Cancel)</button>
    </form>
  </div>

  <!-- News List Card (Manage) -->
  <div class="admin-card">
    <h2>پبلش ٿيل خبرن جو انتظام (Manage News)</h2>
    <table>
      <thead>
        <tr>
          <th>عنوان</th>
          <th>ڪيٽيگري</th>
          <th>تاريخ</th>
          <th>عمل (Actions)</th>
        </tr>
      </thead>
      <tbody id="admin-news-table">
        <tr><td colspan="4" style="text-align:center;">خبرون لوڊ ٿي رهيون آهن...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Supabase Integration -->
  <script>
    const SUPABASE_URL = 'https://hhywazbkgalioqqpuhyz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhoeXdhemJrZ2FsaW9xcXB1aHl6Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4ODE0OTI0MCwiZXhwIjoyMTAzNzI1MjQwfQ.yHHUaGrOn8gKy_1kgujNXupqziJZmQalVIS0F9AU0sY';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 1. Fetch & Show All News in Table
    async function fetchAdminNews() {
      const { data: newsData, error } = await _supabase
        .from('news')
        .select('*')
        .order('created_at', { ascending: false });

      const tableBody = document.getElementById('admin-news-table');

      if (error) {
        tableBody.innerHTML = '<tr><td colspan="4">خبرون لوڊ ڪرڻ ۾ مسئلو پيش آيو.</td></tr>';
        console.error(error);
        return;
      }

      if (newsData && newsData.length > 0) {
        tableBody.innerHTML = newsData.map(n => `
          <tr>
            <td><strong>${n.title}</strong></td>
            <td><span style="background:#e2e8f0; padding:2px 6px; border-radius:4px;">${n.category}</span></td>
            <td>${new Date(n.created_at).toLocaleDateString('sd-PK')}</td>
            <td>
              <button class="btn-action btn-edit" onclick="startEdit('${n.id}', \`${encodeURIComponent(n.title)}\`, \`${encodeURIComponent(n.content)}\`, '${n.category}', '${n.image_url || ''}', ${n.is_trending})">ايڊٽ (Edit)</button>
              <button class="btn-action btn-delete" onclick="deleteNews('${n.id}')">ڊليٽ (Delete)</button>
            </td>
          </tr>
        `).join('');
      } else {
        tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center;">ڪابه خبر موجود ناهي.</td></tr>';
      }
    }

    // 2. Add or Update News Form Submit
    document.getElementById('news-form').addEventListener('submit', async function(e) {
      e.preventDefault();

      const newsId = document.getElementById('news-id').value;
      const title = document.getElementById('title').value;
      const category = document.getElementById('category').value;
      const image_url = document.getElementById('image_url').value;
      const content = document.getElementById('content').value;
      const is_trending = document.getElementById('is_trending').checked;

      if (newsId) {
        // --- EDIT EXISTING NEWS ---
        const { error } = await _supabase
          .from('news')
          .update({ title, category, image_url, content, is_trending })
          .eq('id', newsId);

        if (error) {
          alert('خبر آپڊيٽ نه ٿي سگهي: ' + error.message);
        } else {
          alert('خبر ڪاميابيءَ سان آپڊيٽ (Edit) ٿي وئي!');
          resetForm();
          fetchAdminNews();
        }
      } else {
        // --- ADD NEW NEWS ---
        const { error } = await _supabase
          .from('news')
          .insert([{ title, category, image_url, content, is_trending }]);

        if (error) {
          alert('خبر پبلش ڪرڻ ۾ مسئلو آيو: ' + error.message);
        } else {
          alert('خبر ڪاميابيءَ سان پبلش ٿي وئي!');
          resetForm();
          fetchAdminNews();
        }
      }
    });

    // 3. Fill Form for Edit Mode
    function startEdit(id, encodedTitle, encodedContent, category, image_url, is_trending) {
      document.getElementById('news-id').value = id;
      document.getElementById('title').value = decodeURIComponent(encodedTitle);
      document.getElementById('content').value = decodeURIComponent(encodedContent);
      document.getElementById('category').value = category;
      document.getElementById('image_url').value = (image_url === 'null') ? '' : image_url;
      document.getElementById('is_trending').checked = is_trending;

      document.getElementById('form-heading').innerText = "خبر ۾ تبديلي (Edit News)";
      document.getElementById('btn-submit').innerText = "آپڊيٽ ڪريو (Update)";
      document.getElementById('btn-cancel').style.display = "inline-block";
      
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 4. Delete News
    async function deleteNews(id) {
      if (confirm('ڇا توهان يقينن هي خبر ڊليٽ ڪرڻ چاهيو ٿا؟')) {
        const { error } = await _supabase
          .from('news')
          .delete()
          .eq('id', id);

        if (error) {
          alert('خبر ڊليٽ نہ ٿي سگهي: ' + error.message);
        } else {
          alert('خبر ڊليٽ ٿي وئي!');
          fetchAdminNews();
        }
      }
    }

    // 5. Reset Form to Normal Add Mode
    function resetForm() {
      document.getElementById('news-form').reset();
      document.getElementById('news-id').value = '';
      document.getElementById('form-heading').innerText = "نئين خبر شامل ڪريو";
      document.getElementById('btn-submit').innerText = "خبر پبلش ڪريو";
      document.getElementById('btn-cancel').style.display = "none";
    }

    // Load News List on Page Load
    fetchAdminNews();
  </script>
</body>
</html>
