<!DOCTYPE html>
<html lang="sd">
<head>
  <meta charset="UTF-8">
  <title>News Admin Panel</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; direction: rtl; padding: 20px; max-width: 600px; margin: auto; }
    input, textarea, select, button { width: 100%; margin-bottom: 12px; padding: 10px; box-sizing: border-box; }
    button { background: #007bff; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <h2>نئين خبر داخل ڪريو</h2>
  <input type="text" id="title" placeholder="خبر جي سرخي (Title)">
  <textarea id="content" rows="5" placeholder="خبر جو تفصيل"></textarea>
  <select id="category">
    <option value="local">لوڪل خبرون</option>
    <option value="international">انٽرنيشنل خبرون</option>
    <option value="sports">اسپورٽس</option>
    <option value="trending">تازه ترين</option>
  </select>
  <label><input type="checkbox" id="is_trending"> ڇا هيءَ خبر مٿين سلائيڊر ۾ هلائڻي آهي؟</label>
  <button onclick="publishNews()">خبر پبلش ڪريو</button>

  <script>
    const SUPABASE_URL = 'https://hhywazbkgalioqqpuhyz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhoeXdhemJrZ2FsaW9xcXB1aHl6Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4ODE0OTI0MCwiZXhwIjoyMTAzNzI1MjQwfQ.yHHUaGrOn8gKy_1kgujNXupqziJZmQalVIS0F9AU0sY';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function publishNews() {
      const title = document.getElementById('title').value;
      const content = document.getElementById('content').value;
      const category = document.getElementById('category').value;
      const is_trending = document.getElementById('is_trending').checked;

      const { data, error } = await _supabase
        .from('news')
        .insert([{ title, content, category, is_trending }]);

      if (error) alert('خرابي: ' + error.message);
      else {
        alert('خبر کاميابي سان پبلش ٿي وئي!');
        location.reload();
      }
    }
  </script>
</body>
</html>
